<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hangman — chalkboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Permanent+Marker&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Reusable chalk-roughen filter. Zero-size SVG; referenced via CSS filter: url(#chalk-rough) -->
  <svg width="0" height="0" style="position: absolute">
    <defs>
      <filter id="chalk-rough" x="-30%" y="-30%" width="160%" height="160%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <main class="stage">
    <div class="board" id="board">
      <h1 class="headline chalk-text">Hangman</h1>

      <svg class="gallows" id="gallows" viewBox="0 0 220 180" aria-hidden="true">
        <g class="frame" stroke="#F2F0E6" stroke-width="4" stroke-linecap="round" fill="none">
          <line x1="20" y1="165" x2="95" y2="165" />
          <line x1="45" y1="165" x2="45" y2="15" />
          <line x1="45" y1="15" x2="130" y2="15" />
          <line x1="130" y1="15" x2="130" y2="38" />
        </g>
        <g class="figure" stroke="#F2F0E6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <circle class="part" data-part="1" cx="130" cy="52" r="14" />
          <line class="part" data-part="2" x1="130" y1="66" x2="130" y2="115" />
          <line class="part" data-part="3" x1="130" y1="80" x2="107" y2="98" />
          <line class="part" data-part="4" x1="130" y1="80" x2="153" y2="98" />
          <line class="part" data-part="5" x1="130" y1="115" x2="110" y2="150" />
          <line class="part" data-part="6" x1="130" y1="115" x2="150" y2="150" />
        </g>
      </svg>

      <div class="miss-pips" id="miss-pips" aria-hidden="true"></div>

      <div class="word-row" id="word-row"></div>

      <p class="banner chalk-text" id="banner">Pick a letter.</p>

      <div class="keyboard" id="keyboard"></div>

      <button class="new-word" id="new-word-btn" type="button">New word</button>
    </div>

    <div class="tray">
      <svg class="chalk-stick" viewBox="0 0 60 16" aria-hidden="true">
        <rect x="2" y="2" width="40" height="11" rx="3" fill="#F2F0E6" />
        <rect x="2" y="2" width="40" height="4" rx="2" fill="#ffffff" opacity="0.35" />
      </svg>
      <div class="dust"></div>
    </div>
  </main>

  <script type="module" src="game.js"></script>
</body>
</html>
